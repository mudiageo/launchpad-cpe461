<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad – Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <main class="signup-container">
    <div class="signup-card" role="form" aria-labelledby="signup-title">
      <header class="signup-header">
        <h1 id="signup-title">Sign Up</h1>
        <p class="subtitle">Create your account</p>
        <p class="supporting-text">Join Launchpad to share and discover startup ideas</p>
      </header>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" placeholder="John Doe" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
          <p class="helper-text" id="password-helper">Must be at least 8 characters</p>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree">I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a></label>
        </div>

        <button type="submit" id="submit-btn" class="primary-btn" disabled>Create account</button>
      </form>

      <footer class="signup-footer">
        <p>Already have an account? <a href="signin.html" class="link link-primary">Sign in</a></p>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
